name: BioDataHub CI/CD

on:
  push:
    branches:
      - main

jobs:
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        run: pip install -r requirements.txt

      - name: Validate backend
        run: python -m compileall app

  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        run: npm run build

  deploy:
    name: Deploy to staging
    runs-on: ubuntu-latest
    needs:
      - backend-ci
      - frontend-ci

    steps:
      - name: Deploy to staging VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          port: 22
          script: |
            set -e

            cd /var/www/html/biodatahub

            echo "Pulling latest code..."
            git pull --ff-only origin main

            echo "Installing backend dependencies..."
            /var/www/html/biodatahub-venv/bin/pip install -r requirements.txt

            echo "Installing frontend dependencies..."
            cd frontend
            npm ci

            echo "Building frontend..."
            npm run build

            cd ..

            echo "Restarting BioDataHub API..."
            sudo systemctl restart biodatahub

            echo "Checking BioDataHub service..."
            sudo systemctl is-active --quiet biodatahub

            echo "Checking API health..."
            curl --fail --silent --show-error http://127.0.0.1:8001/health

            echo ""
            echo "Deployment completed successfully."